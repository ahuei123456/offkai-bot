name: Frontend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run native Node tests
        run: npm test --prefix frontend

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Build application
        run: |
          cd frontend
          npm run build

      - name: Build Frontend Docker Image
        run: docker build -t chibachanners-frontend -f frontend/Dockerfile frontend/

      - name: Smoke test Sharp in frontend image
        run: |
          docker run --rm --entrypoint node chibachanners-frontend -e '
            const sharp = require("sharp");
            (async () => {
              const png = await sharp({ create: { width: 1200, height: 600, channels: 3, background: "white" } }).png().toBuffer();
              const { info } = await sharp(png).resize({ width: 1080, withoutEnlargement: true }).webp({ quality: 85 }).toBuffer({ resolveWithObject: true });
              if (info.format !== "webp" || info.width !== 1080 || info.height !== 540) throw new Error("Unexpected Sharp output");
            })().catch(error => { console.error(error); process.exit(1); });'
